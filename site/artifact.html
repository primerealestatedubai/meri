<title>MERI Walkthrough</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Roboto:wght@300;400&display=swap">
<style>
  /* Layout: one fixed video stage, a tall scroll track drives the camera.
     Single dark look by choice: the video is the design. */
  :root {
    --ink: #1c130d;
    --paper: #fbf1e4;
    --glow: #f0b56b;
    --mute: rgba(251, 241, 228, 0.82);
    --display: "Playfair Display", Georgia, "Times New Roman", serif;
    --text: "Roboto", "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  html, body { margin: 0; }
  body { background: var(--ink); color: var(--paper); font-family: var(--text); font-weight: 300; -webkit-font-smoothing: antialiased; }
  #track { position: relative; width: 100%; }
  #stage { position: fixed; inset: 0; overflow: hidden; background: var(--ink); }
  .vid { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; background: var(--ink); }
  #idle { opacity: var(--idle, 1); }

  /* light veil over the first frame; clears as the visitor scrolls */
  #veil {
    position: absolute; inset: 0; pointer-events: none;
    backdrop-filter: blur(var(--blur, 5px)); -webkit-backdrop-filter: blur(var(--blur, 5px));
    background: rgba(28, 19, 13, var(--tint, 0.1));
  }
  #scrim { position: absolute; inset: 0; pointer-events: none; opacity: var(--scrim, 0);
    background: linear-gradient(to top, rgba(20,12,7,0.66), rgba(20,12,7,0) 46%); }

  /* intro */
  #intro {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    padding: 0 max(16px, env(safe-area-inset-left, 0px)); pointer-events: none;
    opacity: var(--intro, 1); transform: translateY(calc((1 - var(--intro, 1)) * -18px));
  }
  .logo { margin: 0; line-height: 0; }
  .logo img { width: clamp(190px, 34vw, 440px); height: auto; display: block; margin: 0 auto; filter: drop-shadow(0 4px 40px rgba(20,12,7,0.4)); }
  .tagline { margin: 30px 0 0; font-family: var(--text); font-weight: 300; font-size: clamp(15px, 2vw, 22px); letter-spacing: 0.06em; color: var(--paper); text-shadow: 0 2px 24px rgba(20,12,7,0.55); }
  .cue { position: absolute; left: 50%; bottom: calc(34px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    font-family: var(--text); font-size: 12px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--mute);
    display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .cue i { width: 1px; height: 38px; background: linear-gradient(var(--paper), transparent); animation: drip 1.9s ease-in-out infinite; }
  @keyframes drip { 0% { transform: scaleY(0); transform-origin: top; } 50% { transform: scaleY(1); transform-origin: top; } 51% { transform-origin: bottom; } 100% { transform: scaleY(0); transform-origin: bottom; } }

  /* chapter text: centred, low in the frame with clear space beneath */
  #panel {
    position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    bottom: calc(max(64px, 12vh) + env(safe-area-inset-bottom, 0px));
    margin: 0 auto; max-width: 640px; text-align: center; pointer-events: none;
    opacity: var(--panel, 0); transform: translateY(calc((1 - var(--panel, 0)) * 14px));
  }
  #panel .kicker { font-family: var(--text); font-weight: 400; font-size: 12px; letter-spacing: 0.32em; text-indent: 0.32em; text-transform: uppercase; color: var(--glow); margin: 0 auto 14px; max-width: none; text-align: center; }
  #panel h2 { font-family: var(--display); font-weight: 400; font-size: clamp(32px, 5vw, 60px); margin: 0 0 14px; line-height: 1.1; letter-spacing: 0.005em; text-wrap: balance; text-shadow: 0 2px 30px rgba(20,12,7,0.5); }
  #stage.end #panel { bottom: auto; top: 50%; transform: translateY(calc(-50% + (1 - var(--panel, 0)) * 14px)); }
  #stage.end #bar a { pointer-events: none; }
  #panel .cta { display: none; margin: 26px auto 0; pointer-events: auto; color: var(--ink); background: var(--paper); text-decoration: none; font-family: var(--text); font-weight: 400; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; padding: 15px 30px; border-radius: 999px; width: fit-content; }
  #panel .cta:hover { background: #fff; }
  #panel .cta:focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }
  #panel p { font-family: var(--text); font-weight: 300; margin: 0 auto; font-size: clamp(15px, 1.5vw, 19px); line-height: 1.55; color: var(--mute); max-width: 40ch; text-shadow: 0 1px 18px rgba(20,12,7,0.6); }

  /* route rail */
  #rail { position: absolute; top: 50%; transform: translateY(-50%); right: max(14px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 14px; opacity: var(--railo, 0); pointer-events: none; }
  #rail span { width: 7px; height: 7px; border-radius: 50%; background: rgba(251,241,228,0.32); transition: background .3s, transform .3s; }
  #rail span.on { background: var(--glow); transform: scale(1.5); }

  /* top bar */
  #bar { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center;
    padding: calc(18px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
    opacity: var(--bar, 0); pointer-events: none; }
  #bar img { height: 26px; width: auto; display: block; }
  #bar a { pointer-events: auto; color: var(--paper); text-decoration: none; font-family: var(--text); font-weight: 400; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase;
    padding: 10px 16px; border: 1px solid rgba(251,241,228,0.5); border-radius: 999px; background: rgba(28,19,13,0.42); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #bar a:focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }

  /* loading */
  #load { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: var(--ink); transition: opacity .7s ease, visibility .7s; }
  #load.done { opacity: 0; visibility: hidden; }
  #load > div { text-align: center; }
  #load .logo img { width: clamp(130px, 22vw, 240px); }
  #load .meter { width: min(240px, 60vw); height: 2px; margin: 28px auto 0; background: rgba(251,241,228,0.18); overflow: hidden; }
  #load .meter i { display: block; height: 100%; width: 100%; background: var(--glow); transform: scaleX(var(--p, 0)); transform-origin: left; }


  /* memberships: glowing icon over the box on the desk. Click: the real box video plays (camera in, lid opens),
     then the three membership cards rise out of the open box. No dark pop-up: the video stays on screen. */
  #stage.memopen #panel, #stage.memopen #rail, #stage.memopen #bar { opacity: 0 !important; transition: opacity .4s; pointer-events: none; }
  #vid3 { transition: opacity .25s ease; }
  #mem-btn { position: absolute; z-index: 6; left: var(--mx, 50%); top: var(--my, 50%); width: 58px; height: 58px; margin: -29px 0 0 -29px; padding: 0; border-radius: 50%;
    border: 1px solid rgba(255, 226, 160, .75); color: #ffe7a8; cursor: pointer; opacity: var(--memo, 0); pointer-events: none;
    background: radial-gradient(circle at 35% 28%, rgba(255, 240, 200, .38), rgba(58, 36, 14, .62));
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    box-shadow: 0 0 22px 2px rgba(255, 200, 100, .35), 0 10px 30px rgba(20, 12, 7, .5);
    transition: transform .35s cubic-bezier(.2, .8, .2, 1), box-shadow .35s, opacity .4s; }
  #mem-btn.on { pointer-events: auto; }
  #stage.memopen #mem-btn, #stage.memopen #mem-line { opacity: 0 !important; pointer-events: none; transition: opacity .3s; }
  #mem-btn .core { position: absolute; inset: 0; display: grid; place-items: center; animation: memBob 3.4s ease-in-out infinite; }
  #mem-btn svg { width: 25px; height: 25px; filter: drop-shadow(0 0 6px rgba(255, 210, 120, .8)); }
  #mem-btn .ring { position: absolute; inset: -1px; border-radius: 50%; border: 1px solid rgba(255, 214, 120, .8); animation: memPulse 2.8s ease-out infinite; pointer-events: none; }
  #mem-btn .ring.r2 { animation-delay: 1.4s; }
  #mem-btn:hover, #mem-btn:focus-visible { transform: scale(1.14); box-shadow: 0 0 40px 10px rgba(255, 196, 90, .6), 0 10px 30px rgba(20, 12, 7, .5); outline: none; }
  #mem-btn .tip { position: absolute; left: 100%; top: 50%; margin-left: 16px; padding: 9px 16px; border-radius: 999px; white-space: nowrap; opacity: 0; pointer-events: none;
    transform: translate(-8px, -50%); transition: opacity .3s, transform .3s; background: rgba(28, 19, 13, .74); border: 1px solid rgba(255, 226, 160, .35);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); color: var(--paper); font: 400 11px var(--text); letter-spacing: .24em; text-transform: uppercase; }
  #mem-btn:hover .tip, #mem-btn:focus-visible .tip { opacity: 1; transform: translate(0, -50%); }
  #mem-line { position: absolute; z-index: 5; left: var(--mx, 50%); top: calc(var(--my, 50%) + 30px); width: 1px; height: var(--ml, 0px); margin-left: -.5px; opacity: var(--memo, 0); pointer-events: none;
    background: linear-gradient(rgba(255, 226, 160, .85), rgba(255, 226, 160, .15)); }
  #mem-line::after { content: ""; position: absolute; left: -4px; bottom: -4px; width: 9px; height: 9px; border-radius: 50%; background: #ffe2a0; box-shadow: 0 0 14px 4px rgba(255, 200, 100, .7); animation: memDot 2.2s ease-in-out infinite; }
  @keyframes memBob { 0%, 100% { transform: translateY(-2px); } 50% { transform: translateY(3px); } }
  @keyframes memPulse { 0% { transform: scale(1); opacity: .85; } 100% { transform: scale(2.2); opacity: 0; } }
  @keyframes memDot { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: .6; } }

  #mem { position: absolute; inset: 0; z-index: 12; display: grid; place-items: center; overflow: hidden; visibility: hidden; pointer-events: none; --cw: min(27vw, 340px, calc((100vh - 130px) * .815)); }
  #mem.open { visibility: visible; pointer-events: auto; }
  #mem .mem-shade { position: absolute; inset: 0; opacity: 0; transition: opacity .7s ease; pointer-events: none;
    background: radial-gradient(ellipse at 50% 55%, rgba(20, 12, 7, .12), rgba(20, 12, 7, .5) 100%); }
  #mem.cards .mem-shade { opacity: 1; }
  #mem .mem-x { position: absolute; top: max(22px, env(safe-area-inset-top, 0px)); right: max(22px, env(safe-area-inset-right, 0px)); z-index: 9; width: 46px; height: 46px; border-radius: 50%; cursor: pointer;
    border: 1px solid rgba(255, 226, 160, .5); background: rgba(28, 19, 13, .5); color: var(--paper); font: 300 24px/1 var(--text); display: grid; place-items: center; padding: 0 0 3px;
    opacity: 0; transform: scale(.8); transition: opacity .5s .5s, transform .5s .5s, background .3s; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  #mem.cards .mem-x { opacity: 1; transform: none; }
  #mem .mem-x:hover, #mem .mem-x:focus-visible { background: rgba(255, 226, 160, .22); outline: none; }
  #mem .cards { position: relative; z-index: 3; display: flex; align-items: center; justify-content: center; gap: clamp(14px, 2.4vw, 34px); padding: 3vh 4vw 9vh; }
  #mem .card { position: relative; width: var(--cw); aspect-ratio: 1106 / 1357; opacity: 0; --i: 0; --dx: 0px; --dy: 0px; --rot: 0deg; filter: drop-shadow(0 26px 44px rgba(0, 0, 0, .5)); will-change: transform, opacity; }
  #mem .card:nth-child(1) { --i: 0; --rot: -8deg; }
  #mem .card:nth-child(2) { --i: 1; --rot: 0deg; }
  #mem .card:nth-child(3) { --i: 2; --rot: 8deg; }
  #mem .card img { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-drag: none; }
  #mem.cards .card { animation: memRise .95s cubic-bezier(.18, .9, .25, 1.04) both; animation-delay: calc(var(--i) * .2s); }
  #mem.sink .card { animation: memSink .5s cubic-bezier(.5, 0, .8, .4) both; animation-delay: calc((2 - var(--i)) * .06s); }
  @keyframes memRise { 0% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.2) rotate(var(--rot)); } 14% { opacity: 1; } 100% { opacity: 1; transform: none; } }
  @keyframes memSink { 0% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.2) rotate(var(--rot)); } }
  #mem .book { position: absolute; left: 50%; bottom: 3.5%; width: 64%; height: 7.4%; min-height: 32px; transform: translateX(-50%); border-radius: 999px; display: grid; place-items: center; text-decoration: none; cursor: pointer;
    background: #f3cf72; color: #3b2410; font: 500 clamp(10px, .95vw, 12.5px) var(--text); letter-spacing: .3em; text-indent: .3em; text-transform: uppercase;
    box-shadow: 0 6px 18px rgba(184, 134, 40, .32); transition: background .25s, transform .25s, box-shadow .25s; }
  #mem .book:hover, #mem .book:focus-visible { background: #f9dc8e; transform: translateX(-50%) translateY(-2px); box-shadow: 0 10px 24px rgba(184, 134, 40, .45); outline: none; }
  #mem .book:active { transform: translateX(-50%) translateY(0); }
  @media (max-width: 760px) {
    #mem { place-items: start center; overflow-y: auto; overflow-x: hidden; --cw: min(84vw, 360px); }
    #mem .cards { flex-direction: column; gap: 22px; padding: 78px 0 48px; }
  }
  @media (prefers-reduced-motion: reduce) { .cue i, #mem-btn .core, #mem-btn .ring, #mem-line::after { animation: none; } #mem.cards .card, #mem.sink .card { animation-duration: .01s; animation-delay: 0s; } }
</style>

<div id="track">
  <div id="stage">
    <video id="vid" class="vid" muted playsinline preload="auto" poster="assets/poster.jpg" aria-label="Walkthrough of the MERI studio, driven by scrolling"></video>
    <video id="idle" class="vid" muted playsinline loop preload="auto" aria-hidden="true"></video>
    <video id="vid2" class="vid" muted playsinline preload="auto" aria-hidden="true" style="opacity:0"></video>
    <video id="vid3" class="vid" muted playsinline preload="auto" aria-hidden="true" style="opacity:0"></video>
    <div id="scrim"></div>
    <div id="veil"></div>

    <div id="bar"><img src="assets/logo.png" alt="MERI"><a href="#book" id="book">Book a session</a></div>

    <div id="intro">
      <div>
        <h1 class="logo"><img src="assets/logo.png" alt="MERI"></h1>
        <p class="tagline">Bringing Nordic Wellness to Madrid.</p>
      </div>
      <div class="cue"><span>Scroll to enter</span><i></i></div>
    </div>

    <div id="panel">
      <p class="kicker" id="pk"></p>
      <h2 id="pt"></h2>
      <p id="pd"></p>
      <a id="pc" class="cta" href="#book"></a>
    </div>

    <div id="rail" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <button id="mem-btn" type="button" aria-label="Memberships" aria-haspopup="dialog" tabindex="-1">
      <span class="ring"></span><span class="ring r2"></span>
      <span class="core"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M6.5 4h11L21 9l-9 11L3 9z"/><path d="M3 9h18M9.5 4 8 9l4 11 4-11-1.5-5"/></svg></span>
      <span class="tip">Memberships</span>
    </button>
    <div id="mem-line" aria-hidden="true"></div>

    <div id="mem" role="dialog" aria-modal="true" aria-label="Memberships" aria-hidden="true">
      <div class="mem-shade"></div>
      <button class="mem-x" type="button" aria-label="Close memberships">&times;</button>
      <div class="cards">
        <article class="card"><img src="assets/m1-ritual.webp" alt="The MERI Ritual, introductory offer, 50 euros"><a class="book" href="#">Book now</a></article>
        <article class="card"><img src="assets/m2-balance.webp" alt="Balance membership, 220 euros a month, 4 move and recover experiences"><a class="book" href="#">Book now</a></article>
        <article class="card"><img src="assets/m3-rhythm.webp" alt="Rhythm membership, 380 euros a month, 8 move and recover experiences"><a class="book" href="#">Book now</a></article>
      </div>
    </div>
  </div>
</div>

<div id="load"><div><div class="logo"><img src="assets/logo.png" alt="MERI"></div><div class="meter"><i></i></div></div></div>

<script>
(function () {
  "use strict";

  // Video time (seconds) at each stop. The tour is the first four shots chained (24 fps).
  var T = { start: 0, stairs: 3.0, desk: 187 / 24, hall: 283 / 24, spa: 403 / 24 };
  // Second video, three stretches, 24 fps: front desk to the yoga entrance (0 to yogaIn), through the
  // glass door into the yoga room (to yoga), then the white door into the Pilates room (pil0 to pil1).
  // The Pilates stretch starts on the same yoga-entrance view that the yoga stretch passes through,
  // and the video's first frame is the same view as the tour at the front desk, so every hand-over
  // between stretches and between the two videos is invisible.
  var T2 = { desk: 0, yogaIn: 108 / 24, yoga: 217 / 24, pil0: 218 / 24, pil1: 365 / 24 };

  // Timeline: each step is one stretch of scrolling, in screen heights x 100.
  // from > to plays the video in reverse. `text` names the stop whose copy shows.
  var STEPS = [
    { vh: 70,  from: T.start,  to: T.start,  intro: true },
    { vh: 120, from: T.start,  to: T.stairs },
    { vh: 170, from: T.stairs, to: T.desk,   textIn: "desk" },
    { vh: 70,  from: T.desk,   to: T.desk,   hold: "desk" },
    { vh: 130, from: T.desk,   to: T.hall,   textOut: "desk" },
    { vh: 160, from: T.hall,   to: T.spa,    textIn: "spa" },
    { vh: 90,  from: T.spa,    to: T.spa,    hold: "spa" },
    { vh: 230, from: T.spa,    to: T.desk,   textOut: "spa" },
    { vh: 70,  from: T.desk,   to: T.desk },
    { vh: 110, from: T2.desk,   to: T2.yogaIn, v: 2 },
    { vh: 30,  from: T2.yogaIn, to: T2.yogaIn, v: 2 },
    { vh: 140, from: T2.yogaIn, to: T2.yoga,   v: 2, textIn: "yoga" },
    { vh: 80,  from: T2.yoga,   to: T2.yoga,   v: 2, hold: "yoga" },
    { vh: 120, from: T2.yoga,   to: T2.yogaIn, v: 2, textOut: "yoga" },
    { vh: 150, from: T2.pil0,   to: T2.pil1,   v: 2, textIn: "pilates" },
    { vh: 80,  from: T2.pil1,   to: T2.pil1,   v: 2, hold: "pilates" },
    { vh: 120, from: T2.pil1,   to: T2.pil0,   v: 2, textOut: "pilates" },
    { vh: 90,  from: T2.yogaIn, to: T2.desk,   v: 2 },
    { vh: 70,  from: T.desk,    to: T.stairs },
    { vh: 60,  from: T.stairs,  to: T.start },
    { vh: 110, from: T.start,   to: T.start,   hold: "book" }
  ];

  // Placeholder copy for the stops and the closing call to action. Replace with the final lines.
  var COPY = {
    desk: { k: "Reception", t: "The front desk", d: "Your first stop. Check in, grab a tea, and settle in." },
    spa:  { k: "Heat & cold", t: "Cold plunge and sauna", d: "Two plunge pools, a long bench and a sauna to finish." },
    yoga: { k: "Yoga", t: "Yoga Studio", d: "A calm room of warm light, mirrors and mats for slow, mindful movement." },
    pilates: { k: "Pilates", t: "SculptFormer", d: "A row of reformers in a quiet, curtained room for strong, controlled work." },
    book: { k: "MERI", t: "Book your first session", d: "Bringing Nordic Wellness to Madrid.", cta: "Book a session" }
  };
  var RAIL = [1, 2, 4, 5, 9, 14]; // first step that lights each dot; see paint()

  var track = document.getElementById("track");
  var stage = document.getElementById("stage");
  var vid = document.getElementById("vid");
  var vid2 = document.getElementById("vid2");
  var vid3 = document.getElementById("vid3");
  var idle = document.getElementById("idle");
  var rail = document.getElementById("rail").children;
  var pk = document.getElementById("pk"), pt = document.getElementById("pt"), pd = document.getElementById("pd"), pc = document.getElementById("pc");
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var total = 0, starts = [];
  STEPS.forEach(function (s) { starts.push(total); total += s.vh; });

  var vh = window.innerHeight;
  function size() { vh = window.innerHeight; track.style.height = ((total / 100) * vh + vh) + "px"; }
  size();
  window.addEventListener("resize", size);

  function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }
  function ease(t) { return t * t * (3 - 2 * t); }

  function evaluate(pos) {
    var p = clamp(pos, 0, total - 0.0001), i = 0;
    for (var k = 0; k < STEPS.length; k++) { if (p >= starts[k]) i = k; }
    var s = STEPS[i], u = clamp((p - starts[i]) / s.vh, 0, 1);
    return { time: s.from + (s.to - s.from) * u, step: i, u: u, s: s };
  }

  // Seeking: never queue more than one pending seek per video.
  var ready = false;
  function Scrubber(el, fallbackLen) {
    var self = this; this.el = el; this.seeking = false; this.duration = 0;
    el.addEventListener("seeked", function () { self.seeking = false; });
    el.addEventListener("loadedmetadata", function () { self.duration = el.duration; });
    this.seek = function (t) {
      if (!ready || self.seeking) return;
      t = clamp(t, 0, Math.max(0, (self.duration || fallbackLen) - 0.04));
      if (Math.abs(el.currentTime - t) < 1 / 60) return;
      self.seeking = true;
      if (el.fastSeek && !reduce) { try { el.fastSeek(t); return; } catch (e) {} }
      el.currentTime = t;
    };
  }
  var main = new Scrubber(vid, 16.8), second = new Scrubber(vid2, 15.3);

  var shownCopy = "";
  function setCopy(key) {
    if (key === shownCopy) return;
    shownCopy = key;
    var c = COPY[key]; pk.textContent = c.k; pt.textContent = c.t; pd.textContent = c.d;
    pc.textContent = c.cta || ""; pc.style.display = c.cta ? "block" : "none";
  }

  var idlePlaying = false;
  function paint(st) {
    var s = st.s, root = stage.style;

    // Intro: logo, light blur and the idle loop all clear over the first stretch of scrolling.
    var intro = s.intro ? 1 - ease(clamp(st.u * 1.1, 0, 1)) : 0;
    root.setProperty("--intro", intro.toFixed(3));
    // End screen: the same light blur as the intro comes back over the first frame, with the booking text.
    var end = st.step === 19 ? ease(clamp((st.u - 0.4) / 0.6, 0, 1)) : (st.step === 20 ? 1 : 0);
    var veil = Math.max(intro, end);
    stage.classList.toggle("end", st.step >= 19);
    root.setProperty("--blur", (5 * veil).toFixed(2) + "px");
    root.setProperty("--tint", (0.1 * veil).toFixed(3));
    root.setProperty("--bar", (1 - veil).toFixed(3));
    root.setProperty("--railo", (1 - veil).toFixed(3));
    var idleOp = s.intro ? 1 - ease(clamp(st.u * 3, 0, 1)) : 0;
    root.setProperty("--idle", idleOp.toFixed(3));
    if (idleOp > 0.01 && !idlePlaying && !reduce) { idlePlaying = true; var pr = idle.play(); if (pr && pr.catch) pr.catch(function () { idlePlaying = false; }); }
    if (idleOp <= 0.01 && idlePlaying) { idle.pause(); idlePlaying = false; }

    vid2.style.opacity = s.v === 2 ? 1 : 0;

    // Text only at the front desk and at the cold plunge and sauna.
    var key = s.hold || s.textIn || s.textOut || "", amt = 0;
    if (s.hold === "book") amt = ease(clamp(st.u * 8, 0, 1));
    else if (s.hold) amt = 1;
    else if (s.textIn) amt = ease(clamp((st.u - 0.72) / 0.28, 0, 1));
    else if (s.textOut) amt = 1 - ease(clamp(st.u / 0.14, 0, 1));
    if (key) setCopy(key);
    root.setProperty("--panel", amt.toFixed(3));
    root.setProperty("--scrim", (amt * (key === "book" ? 0.25 : 0.9)).toFixed(3));

    var dot = -1;
    if (!s.intro && st.step < 18) { for (var r = 0; r < RAIL.length; r++) { if (st.step >= RAIL[r]) dot = r; } }
    for (var d = 0; d < rail.length; d++) rail[d].className = d === dot ? "on" : "";
    updateMem(st);
  }

  var current = 0;
  function frame() {
    var y = window.scrollY || document.documentElement.scrollTop || 0;
    var want = (y / vh) * 100;
    if (reduce) current = want; else current += (want - current) * 0.14;
    if (Math.abs(want - current) < 0.002) current = want;
    var st = evaluate(current);
    paint(st);
    (st.s.v === 2 ? second : main).seek(st.time);
    requestAnimationFrame(frame);
  }

  function start() {
    if (ready) return;
    ready = true;
    document.getElementById("load").classList.add("done");
    requestAnimationFrame(frame);
  }

  // Load both videos as blobs so scrubbing works on any static host, with one progress bar.
  var meter = document.querySelector("#load .meter");
  function setP(p) { meter.style.setProperty("--p", clamp(p, 0, 1)); }
  var FILES = [{ el: vid, src: "assets/tour.mp4", got: 0, len: 0, done: false }, { el: vid2, src: "assets/tour2.mp4", got: 0, len: 0, done: false }, { el: vid3, src: "assets/box.mp4", got: 0, len: 0, done: false }];
  function progress() {
    var got = 0, len = 0;
    FILES.forEach(function (f) { got += f.got; len += f.len || 0; });
    if (len) setP(got / len);
  }
  function fileDone(f) {
    f.done = true;
    if (FILES.every(function (x) { return x.done; })) start();
  }
  function useDirect(f) {
    f.el.src = f.src; f.el.load();
    f.el.addEventListener("loadeddata", function () { fileDone(f); }, { once: true });
    setTimeout(function () { if (!f.done) fileDone(f); }, 9000);
  }
  function useBlob(f) {
    fetch(f.src).then(function (res) {
      if (!res.ok) throw new Error("http " + res.status);
      f.len = +res.headers.get("Content-Length") || 0;
      if (!res.body || !res.body.getReader) return res.blob();
      var reader = res.body.getReader(), chunks = [];
      return (function pump() {
        return reader.read().then(function (r) {
          if (r.done) return new Blob(chunks, { type: "video/mp4" });
          chunks.push(r.value); f.got += r.value.length;
          progress();
          return pump();
        });
      })();
    }).then(function (blob) {
      var failed = false;
      f.el.addEventListener("error", function () { if (!failed) { failed = true; useDirect(f); } }, { once: true });
      f.el.addEventListener("loadeddata", function () { if (!failed) fileDone(f); }, { once: true });
      f.el.src = URL.createObjectURL(blob); f.el.load();
      setTimeout(function () { if (!f.done && !failed) { failed = true; useDirect(f); } }, 12000);
    }).catch(function () { useDirect(f); });
  }
  idle.src = "assets/idle.mp4"; idle.load();
  FILES.forEach(useBlob);

  // iOS needs a first play/pause to unlock seeking.
  function prime() {
    [vid, vid2, vid3].forEach(function (v) {
      var p = v.play();
      if (p && p.then) p.then(function () { v.pause(); }).catch(function () {});
    });
    window.removeEventListener("touchstart", prime);
    window.removeEventListener("scroll", prime);
  }
  window.addEventListener("touchstart", prime, { passive: true, once: true });
  window.addEventListener("scroll", prime, { passive: true, once: true });

  // Memberships: a glowing icon over the box on the front desk. Click: the real box video plays fast (camera in, lid opens),
  // the three membership cards rise out of the open box, one by one. Close: the cards sink back and the video plays in
  // reverse to the desk. The Book now buttons go nowhere yet.
  var memBtn = document.getElementById("mem-btn"), memLine = document.getElementById("mem-line"), mem = document.getElementById("mem");
  var memX = mem.querySelector(".mem-x"), memCards = mem.querySelectorAll(".card");
  var BOX = { x: 680, y: 601 };      // centre of the closed box on the desk, in 1920x1080 video pixels
  var TRAY = { x: 959, y: 700 };     // centre of the open box tray in the last frame of the box video
  var BOX_RATE = 1.9, CARDS_AT = 3.85, REVERSE_MS = 1300;
  var memState = "idle", memRaf = 0, memSeeking = false;
  function px(p) { var w = window.innerWidth, h = window.innerHeight, s = Math.max(w / 1920, h / 1080); return { x: (w - 1920 * s) / 2 + p.x * s, y: (h - 1080 * s) / 2 + p.y * s, s: s, w: w, h: h }; }
  function updateMem(st) {
    if (memState !== "idle") return;
    var u = st.u, o = 0;
    if (st.step === 3) o = 1;
    else if (st.step === 2) o = ease(clamp((u - 0.9) / 0.1, 0, 1));
    else if (st.step === 4) o = 1 - ease(clamp(u / 0.04, 0, 1));
    else if (st.step === 8) o = ease(clamp((u - 0.9) / 0.1, 0, 1));
    else if (st.step === 9) o = 1 - ease(clamp(u / 0.04, 0, 1));
    var b = px(BOX), ix = clamp(b.x, 48, b.w - 48), iy = clamp(b.y - 100 * b.s, 60, b.h - 60), on = o > 0.6;
    stage.style.setProperty("--mx", ix.toFixed(1) + "px");
    stage.style.setProperty("--my", iy.toFixed(1) + "px");
    stage.style.setProperty("--ml", Math.max(0, b.y - iy - 30).toFixed(1) + "px");
    stage.style.setProperty("--memo", o.toFixed(3));
    memBtn.classList.toggle("on", on);
    memBtn.tabIndex = on ? 0 : -1;
    memLine.style.display = Math.abs(ix - b.x) < 2 ? "block" : "none";
  }
  function setCardStarts() {   // every card starts at the open tray and rises to its own place
    var t = px(TRAY);
    Array.prototype.forEach.call(memCards, function (c) {
      c.style.setProperty("--dx", "0px"); c.style.setProperty("--dy", "0px");
      var r = c.getBoundingClientRect();
      c.style.setProperty("--dx", (t.x - (r.left + r.width / 2)).toFixed(1) + "px");
      c.style.setProperty("--dy", (t.y - (r.top + r.height / 2)).toFixed(1) + "px");
    });
  }
  function showCards() { setCardStarts(); mem.classList.remove("sink"); mem.classList.add("cards"); try { memX.focus({ preventScroll: true }); } catch (e) {} }
  function watchBox() {
    memRaf = 0;
    if (memState !== "playing") return;
    if (vid3.currentTime >= CARDS_AT && !mem.classList.contains("cards")) showCards();
    if (vid3.ended || vid3.currentTime >= (vid3.duration || 99) - 0.04) { memState = "open"; if (!mem.classList.contains("cards")) showCards(); return; }
    memRaf = requestAnimationFrame(watchBox);
  }
  function openMem() {
    if (memState !== "idle") return;
    memState = "playing";
    document.documentElement.style.overflow = "hidden";
    memBtn.classList.remove("on");
    stage.classList.add("memopen");
    mem.classList.add("open"); mem.setAttribute("aria-hidden", "false");
    vid3.style.opacity = 1;
    vid3.currentTime = 0;
    if (reduce) { vid3.currentTime = Math.max(0, (vid3.duration || 5) - 0.05); memState = "open"; showCards(); return; }
    vid3.playbackRate = BOX_RATE;
    var pr = vid3.play(); if (pr && pr.catch) pr.catch(function () { vid3.currentTime = Math.max(0, (vid3.duration || 5) - 0.05); memState = "open"; showCards(); });
    memRaf = requestAnimationFrame(watchBox);
  }
  function endMem() {
    vid3.style.opacity = 0;
    stage.classList.remove("memopen");
    mem.classList.remove("open", "cards", "sink"); mem.setAttribute("aria-hidden", "true");
    document.documentElement.style.overflow = "";
    memState = "idle";
    try { memBtn.focus({ preventScroll: true }); } catch (e) {}
  }
  function closeMem() {
    if (memState !== "open" && memState !== "playing") return;
    var wasPlaying = memState === "playing";
    memState = "closing"; if (memRaf) cancelAnimationFrame(memRaf); memRaf = 0;
    vid3.pause();
    var sinkMs = mem.classList.contains("cards") ? 560 : 0;
    if (sinkMs) { setCardStarts(); mem.classList.remove("cards"); mem.classList.add("sink"); }
    setTimeout(function () {
      mem.classList.remove("sink");
      var from = vid3.currentTime, t0 = 0;
      if (reduce || from < 0.05) { endMem(); return; }
      var dur = REVERSE_MS * Math.min(1, from / 5);
      function step(now) {
        if (!t0) t0 = now;
        var p = clamp((now - t0) / dur, 0, 1), e = p * p * (3 - 2 * p);
        if (!memSeeking) { memSeeking = true; vid3.currentTime = from * (1 - e); }
        if (p < 1) requestAnimationFrame(step);
        else { vid3.currentTime = 0; setTimeout(endMem, 120); }
      }
      requestAnimationFrame(step);
    }, sinkMs);
  }
  vid3.addEventListener("seeked", function () { memSeeking = false; });
  memBtn.addEventListener("click", openMem);
  memX.addEventListener("click", closeMem);
  mem.addEventListener("click", function (e) { var c = e.target.className; if (e.target === mem || c === "cards" || c === "mem-shade") closeMem(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeMem(); });
  Array.prototype.forEach.call(mem.querySelectorAll(".book"), function (a) { a.addEventListener("click", function (e) { e.preventDefault(); }); });

  // Test hook: ?at=<vh>
  var m = /[?&]at=([\d.]+)/.exec(location.search);
  if (m) window.addEventListener("load", function () { setTimeout(function () { window.scrollTo(0, parseFloat(m[1]) / 100 * vh); }, 50); });
})();
</script>
