<title>MERI Walkthrough</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Roboto:wght@300;400&display=swap">
<style>
  /* Layout: one fixed video stage, a tall scroll track drives the camera.
     Single dark look by choice: the video is the design. */
  :root {
    --ink: #1c130d;
    --paper: #fbf1e4;
    --glow: #f0b56b;
    --mute: rgba(251, 241, 228, 0.82);
    --display: "Playfair Display", Georgia, "Times New Roman", serif;
    --text: "Roboto", "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  html, body { margin: 0; }
  body { background: var(--ink); color: var(--paper); font-family: var(--text); font-weight: 300; -webkit-font-smoothing: antialiased; }
  #track { position: relative; width: 100%; }
  #stage { position: fixed; inset: 0; overflow: hidden; background: var(--ink); }
  .vid { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; background: var(--ink); }
  #idle { opacity: var(--idle, 1); }

  /* light veil over the first frame; clears as the visitor scrolls */
  #veil {
    position: absolute; inset: 0; pointer-events: none;
    backdrop-filter: blur(var(--blur, 5px)); -webkit-backdrop-filter: blur(var(--blur, 5px));
    background: rgba(28, 19, 13, var(--tint, 0.1));
  }
  #scrim { position: absolute; inset: 0; pointer-events: none; opacity: var(--scrim, 0);
    background: linear-gradient(to top, rgba(20,12,7,0.66), rgba(20,12,7,0) 46%); }

  /* intro */
  #intro {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    padding: 0 max(16px, env(safe-area-inset-left, 0px)); pointer-events: none;
    opacity: var(--intro, 1); transform: translateY(calc((1 - var(--intro, 1)) * -18px));
  }
  .logo { margin: 0; line-height: 0; }
  .logo img { width: clamp(190px, 34vw, 440px); height: auto; display: block; margin: 0 auto; filter: drop-shadow(0 4px 40px rgba(20,12,7,0.4)); }
  .tagline { margin: 30px 0 0; font-family: var(--text); font-weight: 300; font-size: clamp(15px, 2vw, 22px); letter-spacing: 0.06em; color: var(--paper); text-shadow: 0 2px 24px rgba(20,12,7,0.55); }
  .cue { position: absolute; left: 50%; bottom: calc(34px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    font-family: var(--text); font-size: 12px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--mute);
    display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .cue i { width: 1px; height: 38px; background: linear-gradient(var(--paper), transparent); animation: drip 1.9s ease-in-out infinite; }
  @keyframes drip { 0% { transform: scaleY(0); transform-origin: top; } 50% { transform: scaleY(1); transform-origin: top; } 51% { transform-origin: bottom; } 100% { transform: scaleY(0); transform-origin: bottom; } }

  /* chapter text: centred, low in the frame with clear space beneath */
  #panel {
    position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    bottom: calc(max(64px, 12vh) + env(safe-area-inset-bottom, 0px));
    margin: 0 auto; max-width: 640px; text-align: center; pointer-events: none;
    opacity: var(--panel, 0); transform: translateY(calc((1 - var(--panel, 0)) * 14px));
  }
  #panel .kicker { font-family: var(--text); font-weight: 400; font-size: 12px; letter-spacing: 0.32em; text-indent: 0.32em; text-transform: uppercase; color: var(--glow); margin: 0 auto 14px; max-width: none; text-align: center; }
  #panel h2 { font-family: var(--display); font-weight: 400; font-size: clamp(32px, 5vw, 60px); margin: 0 0 14px; line-height: 1.1; letter-spacing: 0.005em; text-wrap: balance; text-shadow: 0 2px 30px rgba(20,12,7,0.5); }
  #stage.end #panel { bottom: auto; top: 50%; transform: translateY(calc(-50% + (1 - var(--panel, 0)) * 14px)); }
  #stage.end #bar a { pointer-events: none; }
  #panel .cta { display: none; margin: 26px auto 0; pointer-events: auto; color: var(--ink); background: var(--paper); text-decoration: none; font-family: var(--text); font-weight: 400; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; padding: 15px 30px; border-radius: 999px; width: fit-content; }
  #panel .cta:hover { background: #fff; }
  #panel .cta:focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }
  #panel p { font-family: var(--text); font-weight: 300; margin: 0 auto; font-size: clamp(15px, 1.5vw, 19px); line-height: 1.55; color: var(--mute); max-width: 40ch; text-shadow: 0 1px 18px rgba(20,12,7,0.6); }

  /* route rail */
  #rail { position: absolute; top: 50%; transform: translateY(-50%); right: max(14px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 14px; opacity: var(--railo, 0); pointer-events: none; }
  #rail span { width: 7px; height: 7px; border-radius: 50%; background: rgba(251,241,228,0.32); transition: background .3s, transform .3s; }
  #rail span.on { background: var(--glow); transform: scale(1.5); }

  /* top bar */
  #bar { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center;
    padding: calc(18px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
    opacity: var(--bar, 0); pointer-events: none; }
  #bar img { height: 26px; width: auto; display: block; }
  #bar a { pointer-events: auto; color: var(--paper); text-decoration: none; font-family: var(--text); font-weight: 400; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase;
    padding: 10px 16px; border: 1px solid rgba(251,241,228,0.5); border-radius: 999px; background: rgba(28,19,13,0.42); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #bar a:focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }

  /* loading */
  #load { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: var(--ink); transition: opacity .7s ease, visibility .7s; }
  #load.done { opacity: 0; visibility: hidden; }
  #load > div { text-align: center; }
  #load .logo img { width: clamp(130px, 22vw, 240px); }
  #load .meter { width: min(240px, 60vw); height: 2px; margin: 28px auto 0; background: rgba(251,241,228,0.18); overflow: hidden; }
  #load .meter i { display: block; height: 100%; width: 100%; background: var(--glow); transform: scaleX(var(--p, 0)); transform-origin: left; }


  /* memberships: glowing icon over the box on the desk. Click: the real box video plays (camera in, lid opens),
     then the three membership cards rise out of the open box. No dark pop-up: the video stays on screen. */
  #stage.memopen #panel, #stage.memopen #rail, #stage.memopen #bar { opacity: 0 !important; transition: opacity .4s; pointer-events: none; }
  #vid3 { transition: opacity .25s ease; }
  #mem-btn { position: absolute; z-index: 9; left: var(--mx, 50%); top: var(--my, 50%); width: 58px; height: 58px; margin: -29px 0 0 -29px; padding: 0; border-radius: 50%;
    border: 1px solid rgba(255, 226, 160, .75); color: #ffe7a8; cursor: pointer; opacity: var(--memo, 0); pointer-events: none;
    background: radial-gradient(circle at 35% 28%, rgba(255, 240, 200, .38), rgba(58, 36, 14, .74));
    box-shadow: 0 0 22px 2px rgba(255, 200, 100, .35), 0 10px 30px rgba(20, 12, 7, .5);
    transition: transform .35s cubic-bezier(.2, .8, .2, 1), opacity .4s; will-change: transform; }
  #mem-btn::after, .hub-btn::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: 0 0 46px 12px rgba(255, 196, 90, .62); opacity: 0; transition: opacity .35s ease; pointer-events: none; }
  #mem-btn:hover::after, #mem-btn:focus-visible::after, .hub-btn:hover::after, .hub-btn:focus-visible::after { opacity: 1; }
  #mem-btn.on { pointer-events: auto; }
  #stage.memopen .hub-btn { opacity: 0 !important; pointer-events: none; transition: opacity .3s; }
  #stage.memopen #mem-btn, #stage.memopen #mem-line { opacity: 0 !important; pointer-events: none; transition: opacity .3s; }
  #mem-btn .core { position: absolute; inset: 0; display: grid; place-items: center; animation: memBob 3.4s ease-in-out infinite; }
  #mem-btn svg { width: 25px; height: 25px; filter: drop-shadow(0 0 6px rgba(255, 210, 120, .8)); }
  #mem-btn .ring { position: absolute; inset: -1px; border-radius: 50%; border: 1px solid rgba(255, 214, 120, .8); animation: memPulse 2.8s ease-out infinite; pointer-events: none; }
  #mem-btn .ring.r2 { animation-delay: 1.4s; }
  #mem-btn:hover, #mem-btn:focus-visible { transform: scale(1.14); outline: none; }
  #mem-btn .tip { position: absolute; left: 50%; bottom: 100%; margin-bottom: 14px; padding: 9px 16px; border-radius: 999px; white-space: nowrap; opacity: 0; pointer-events: none;
    transform: translate(-50%, 6px); transition: opacity .3s, transform .3s; background: rgba(28, 19, 13, .86); border: 1px solid rgba(255, 226, 160, .35); color: var(--paper); font: 400 11px var(--text); letter-spacing: .24em; text-transform: uppercase; }
  #mem-btn:hover .tip, #mem-btn:focus-visible .tip { opacity: 1; transform: translate(-50%, 0); }
  #mem-line { position: absolute; z-index: 5; left: var(--mx, 50%); top: calc(var(--my, 50%) + 30px); width: 1px; height: var(--ml, 0px); margin-left: -.5px; opacity: var(--memo, 0); pointer-events: none;
    background: linear-gradient(rgba(255, 226, 160, .85), rgba(255, 226, 160, .15)); }
  #mem-line::after { content: ""; position: absolute; left: -4px; bottom: -4px; width: 9px; height: 9px; border-radius: 50%; background: #ffe2a0; box-shadow: 0 0 14px 4px rgba(255, 200, 100, .7); animation: memDot 2.2s ease-in-out infinite; }
  @keyframes memBob { 0%, 100% { transform: translateY(-2px); } 50% { transform: translateY(3px); } }
  @keyframes memPulse { 0% { transform: scale(1); opacity: .85; } 100% { transform: scale(2.2); opacity: 0; } }
  @keyframes memDot { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: .6; } }

  #mem { position: absolute; inset: 0; z-index: 12; display: grid; place-items: center; overflow: hidden; visibility: hidden; pointer-events: none; --cw: min(27vw, 340px, calc((100vh - 130px) * .815)); }
  #mem.open { visibility: visible; pointer-events: auto; }
  #mem .mem-shade { position: absolute; inset: 0; opacity: 0; transition: opacity .7s ease; pointer-events: none;
    background: radial-gradient(ellipse at 50% 55%, rgba(20, 12, 7, .12), rgba(20, 12, 7, .5) 100%); }
  #mem.cards .mem-shade { opacity: 1; }
  #mem-dust { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; opacity: 0; transition: opacity 1.4s ease; pointer-events: none; }
  #mem.cards #mem-dust { opacity: 1; }
  #mem .mem-x { position: absolute; top: max(22px, env(safe-area-inset-top, 0px)); right: max(22px, env(safe-area-inset-right, 0px)); z-index: 9; width: 46px; height: 46px; border-radius: 50%; cursor: pointer;
    border: 1px solid rgba(255, 226, 160, .5); background: rgba(28, 19, 13, .5); color: var(--paper); font: 300 24px/1 var(--text); display: grid; place-items: center; padding: 0 0 3px;
    opacity: 0; transform: scale(.8); transition: opacity .5s .5s, transform .5s .5s, background .3s; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  #mem.cards .mem-x { opacity: 1; transform: none; }
  #mem .mem-x:hover, #mem .mem-x:focus-visible { background: rgba(255, 226, 160, .22); outline: none; }
  #mem .cards { position: relative; z-index: 3; display: flex; align-items: center; justify-content: center; gap: clamp(14px, 2.4vw, 34px); padding: 3vh 4vw 9vh; }
  #mem .card { position: relative; width: var(--cw); aspect-ratio: 1106 / 1357; opacity: 0; --i: 0; --dx: 0px; --dy: 0px; --rot: 0deg; filter: drop-shadow(0 26px 44px rgba(0, 0, 0, .5)); will-change: transform, opacity; }
  #mem .card:nth-child(1) { --i: 0; --rot: -8deg; }
  #mem .card:nth-child(2) { --i: 1; --rot: 0deg; }
  #mem .card:nth-child(3) { --i: 2; --rot: 8deg; }
  #mem .card img { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-drag: none; }
  #mem.cards .card { animation: memRise .95s cubic-bezier(.18, .9, .25, 1.04) both; animation-delay: calc(var(--i) * .2s); }
  #mem.sink .card { animation: memSink .5s cubic-bezier(.5, 0, .8, .4) both; animation-delay: calc((2 - var(--i)) * .06s); }
  @keyframes memRise { 0% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.2) rotate(var(--rot)); } 14% { opacity: 1; } 100% { opacity: 1; transform: none; } }
  @keyframes memSink { 0% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.2) rotate(var(--rot)); } }
  #mem .book { position: absolute; left: 50%; bottom: 3.5%; width: 64%; height: 7.4%; min-height: 32px; transform: translateX(-50%); border-radius: 999px; display: grid; place-items: center; text-decoration: none; cursor: pointer;
    background: #f3cf72; color: #3b2410; font: 500 clamp(10px, .95vw, 12.5px) var(--text); letter-spacing: .3em; text-indent: .3em; text-transform: uppercase;
    box-shadow: 0 6px 18px rgba(184, 134, 40, .32); transition: background .25s, transform .25s, box-shadow .25s; }
  #mem .book:hover, #mem .book:focus-visible { background: #f9dc8e; transform: translateX(-50%) translateY(-2px); box-shadow: 0 10px 24px rgba(184, 134, 40, .45); outline: none; }
  #mem .book:active { transform: translateX(-50%) translateY(0); }
  @media (max-width: 760px) {
    #mem-dust { position: fixed; }
    #mem { place-items: start center; overflow-y: auto; overflow-x: hidden; --cw: min(84vw, 360px); }
    #mem .cards { flex-direction: column; gap: 22px; padding: 78px 0 48px; }
  }
  @media (prefers-reduced-motion: reduce) { .cue i, #mem-btn .core, #mem-btn .ring, #mem-line::after { animation: none; } #mem.cards .card, #mem.sink .card { animation-duration: .01s; animation-delay: 0s; } }
  /* front desk hub: stone icon (yoga and SculptFormer) and fire and water icon (sauna and cold plunge) */
  .vid { transition: transform 1.1s cubic-bezier(.2, .7, .2, 1); will-change: transform; }
  /* the second video is a separate file; its first frame is close to the desk frame but not identical, so it dissolves in and out instead of cutting */
  #vid2 { transition: transform 1.1s cubic-bezier(.2, .7, .2, 1), opacity .28s ease; }
  #stage.lean-stone .vid { transform: scale(1.07); transform-origin: 0% 55%; }
  #stage.lean-heat .vid { transform: scale(1.07); transform-origin: 48% 44%; }
  #stage.lean-mem .vid { transform: scale(1.05); transform-origin: 36% 56%; }
  .hub-btn { position: absolute; z-index: 6; left: var(--hx, 50%); top: var(--hy, 50%); width: 78px; height: 78px; margin: -39px 0 0 -39px; padding: 0; border-radius: 50%; cursor: pointer;
    border: 1px solid rgba(255, 226, 160, .75); color: #ffe7a8; opacity: var(--memo, 0); pointer-events: none;
    background: radial-gradient(circle at 35% 28%, rgba(255, 240, 200, .34), rgba(58, 36, 14, .72));
    box-shadow: 0 0 22px 2px rgba(255, 200, 100, .3), 0 10px 30px rgba(20, 12, 7, .5);
    transition: transform .4s cubic-bezier(.2, .8, .2, 1), opacity .4s; will-change: transform; }
  .hub-btn.pair { width: 122px; border-radius: 999px; margin-left: -61px; }
  .hub-btn.on { pointer-events: auto; }
  #stage.jny .hub-btn { opacity: 0 !important; pointer-events: none; transition: opacity .25s; }
  .hub-btn .hl { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 8px; animation: memBob 3.6s ease-in-out infinite; }
  .hub-btn .hl img { display: block; height: 30px; width: auto; max-width: 46px; filter: drop-shadow(0 0 6px rgba(255, 210, 120, .75)); transition: filter .4s, transform .4s; }
  .hub-btn:not(.pair) .hl img { height: 26px; max-width: 54px; }
  .hub-btn .ring { position: absolute; inset: -1px; border-radius: inherit; border: 1px solid rgba(255, 214, 120, .8); animation: memPulse 3s ease-out infinite; pointer-events: none; }
  .hub-btn .ring.r2 { animation-delay: 1.5s; }
  .hub-btn:hover, .hub-btn:focus-visible { transform: scale(1.12); outline: none; }
  .hub-btn:hover .hl img, .hub-btn:focus-visible .hl img { filter: drop-shadow(0 0 12px rgba(255, 224, 150, 1)); transform: scale(1.08); }
  .hub-btn .tip { position: absolute; left: 100%; top: 50%; margin-left: 16px; padding: 9px 16px; border-radius: 999px; white-space: nowrap; opacity: 0; pointer-events: none;
    transform: translate(-6px, -50%); transition: opacity .3s, transform .3s; background: rgba(28, 19, 13, .86); border: 1px solid rgba(255, 226, 160, .35); color: var(--paper); font: 400 11px var(--text); letter-spacing: .24em; text-transform: uppercase; }
  .hub-btn:hover .tip, .hub-btn:focus-visible .tip { opacity: 1; transform: translate(0, -50%); }
  .hub-btn.flip .tip { left: auto; right: 100%; margin-left: 0; margin-right: 16px; transform: translate(6px, -50%); }
  .hub-btn.flip:hover .tip, .hub-btn.flip:focus-visible .tip { transform: translate(0, -50%); }
  @media (hover: none) { .hub-btn .tip, .hub-btn.flip .tip { opacity: 1; left: 50%; right: auto; top: 100%; margin: 14px 0 0; transform: translate(-50%, 0); } }
  /* icons placed on the doors and pools inside the rooms, same look as the front desk icons */
  .hub-btn.spot { opacity: 0; pointer-events: none; transition: transform .4s cubic-bezier(.2, .8, .2, 1), opacity .6s .15s; }
  #stage.jny.s-spa .hub-btn.spot.for-spa, #stage.jny.s-yoin .hub-btn.spot.for-yoin { opacity: 1 !important; pointer-events: auto; }
  #gal { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; background: rgba(14, 9, 6, .82); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); opacity: 0; transition: opacity .4s; }
  #gal.show { display: flex; }
  #gal.vis { opacity: 1; }
  #gal figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 0 70px; max-width: 100vw; }
  #gal img { display: block; max-height: 80vh; max-width: min(86vw, 1000px); width: auto; height: auto; border-radius: 6px; box-shadow: 0 24px 80px rgba(0, 0, 0, .55); }
  #gal figcaption { color: var(--paper); font: 400 11px var(--text); letter-spacing: .26em; text-transform: uppercase; opacity: .85; }
  #gal button { position: absolute; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; cursor: pointer; color: var(--paper); font: 300 26px/1 var(--text);
    border: 1px solid rgba(255, 226, 160, .55); background: rgba(28, 19, 13, .55); transition: background .3s, box-shadow .3s; }
  #gal button:hover, #gal button:focus-visible { background: rgba(255, 226, 160, .2); box-shadow: 0 0 24px 4px rgba(255, 196, 90, .35); outline: none; }
  #gal .g-x { top: 22px; right: 22px; }
  #gal .g-prev { left: 18px; top: 50%; margin-top: -23px; }
  #gal .g-next { right: 18px; top: 50%; margin-top: -23px; }
  #gal.one .g-prev, #gal.one .g-next { display: none; }
  @media (max-width: 760px) { #gal figure { padding: 0 12px; } #gal img { max-width: 92vw; max-height: 74vh; } #gal .g-prev { left: 8px; top: auto; bottom: 22px; margin: 0; } #gal .g-next { right: 8px; top: auto; bottom: 22px; margin: 0; } }
  #stage.jny #panel, #stage.jny #rail { opacity: 0 !important; transition: opacity .3s; }
  #stage.jny.jtext #panel { opacity: 1 !important; transform: none !important; transition: opacity .6s; }
  #stage.jny.jtext #scrim { opacity: .9 !important; }
  #stage.jny #mem-btn, #stage.jny #mem-line { opacity: 0 !important; pointer-events: none; }
  #jnui { position: absolute; z-index: 8; left: 0; right: 0; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; gap: 14px; pointer-events: none; padding: 0 16px; }
  #jnui > * { pointer-events: auto; }
  .jn-back { display: inline-flex; align-items: center; gap: 12px; cursor: pointer; color: var(--paper); font: 400 12px var(--text); letter-spacing: .22em; text-transform: uppercase; text-decoration: none;
    padding: 14px 24px; border-radius: 999px; border: 1px solid rgba(255, 226, 160, .55); background: rgba(28, 19, 13, .55); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    transition: background .3s, box-shadow .3s, transform .3s, opacity .4s; }
  .jn-back:hover, .jn-back:focus-visible { background: rgba(255, 226, 160, .2); box-shadow: 0 0 26px 4px rgba(255, 196, 90, .35); outline: none; transform: translateY(-2px); }
  .jn-back { opacity: 0; visibility: hidden; padding: 11px 20px; font-size: 11px; }
  #jnui.back .jn-back { opacity: 1; visibility: visible; }
  @keyframes jnIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  #stage.jny.jtext #jnui { bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
  @media (max-width: 760px) { .hub-btn .tip { font-size: 10px; letter-spacing: .18em; padding: 8px 12px; } }
  @media (prefers-reduced-motion: reduce) { .hub-btn .hl, .hub-btn .ring { animation: none; } .vid { transition: none; } }
</style>

<div id="track">
  <div id="stage">
    <video id="vid" class="vid" muted playsinline preload="auto" poster="assets/poster.jpg" aria-label="Walkthrough of the MERI studio, driven by scrolling"></video>
    <video id="idle" class="vid" muted playsinline loop preload="auto" aria-hidden="true"></video>
    <video id="vid2" class="vid" muted playsinline preload="auto" aria-hidden="true" style="opacity:0"></video>
    <video id="vid3" class="vid" muted playsinline preload="auto" aria-hidden="true" style="opacity:0"></video>
    <div id="scrim"></div>
    <div id="veil"></div>

    <div id="bar"><img src="assets/logo.png" alt="MERI"><a href="#book" id="book">Book a session</a></div>

    <div id="intro">
      <div>
        <h1 class="logo"><img src="assets/logo.png" alt="MERI"></h1>
        <p class="tagline">Bringing Nordic Wellness to Madrid.</p>
      </div>
      <div class="cue"><span>Scroll to enter</span><i></i></div>
    </div>

    <div id="panel">
      <p class="kicker" id="pk"></p>
      <h2 id="pt"></h2>

  var memBtn = document.getElementById("mem-btn"), memLine = document.getElementById("mem-line"), mem = document.getElementById("mem");

    }, sinkMs);
  }
  vid3.addEventListener("seeked", function () { memSeeking = false; });
  memBtn.addEventListener("click", function () { stage.classList.remove("lean-mem"); openMem(); });
  memBtn.addEventListener("mouseenter", function () { if (!jny.active && memState === "idle") stage.classList.add("lean-mem"); });
  memBtn.addEventListener("mouseleave", function () { stage.classList.remove("lean-mem"); });
  memBtn.addEventListener("focus", function () { if (!jny.active && memState === "idle") stage.classList.add("lean-mem"); });
  memBtn.addEventListener("blur", function () { stage.classList.remove("lean-mem"); });
  memX.addEventListener("click", closeMem);
  mem.addEventListener("click", function (e) { var c = e.target.className; if (e.target === mem || c === "cards" || c === "mem-shade") closeMem(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeMem(); });
  Array.prototype.forEach.call(mem.querySelectorAll(".book"), function (a) { a.addEventListener("click", function (e) { e.preventDefault(); }); });

  // Front desk hub. Two icons over the desk frame: the stone icon (yoga and SculptFormer) and the fire and water icon
  // (sauna and cold plunge). A click plays the same footage at a fixed speed, with no scrolling, and stops in the room.
  // Back plays it in reverse. Hover leans the camera a little toward that side.
  var hubEls = { stone: document.getElementById("hb-stone"), heat: document.getElementById("hb-heat") };
  var jnui = document.getElementById("jnui"), jnBack = document.getElementById("jn-back");
  var HUBPT = { stone: { x: 170, y: 560 }, heat: { x: 932, y: 478 } };   // where each icon sits on the 1920x1080 desk frame
  var JRATE = 3.9;                                                       // playback speed of every journey, three times the first version
  var HEATRATE = JRATE;
  var SPOTPT = { plunge: { x: 1620, y: 790 }, sauna: { x: 910, y: 500 }, yoga: { x: 1295, y: 525 }, pilates: { x: 165, y: 540 } };   // icon places on the room frames (1920x1080)
  var SPOTS = { plunge: document.getElementById("sp-water"), sauna: document.getElementById("sp-fire"), yoga: document.getElementById("sp-yoga"), pilates: document.getElementById("sp-sculpt") };
  var jny = { active: false, state: "hub", busy: false, token: 0, seeking: false };
  function updateHub(o) {
    var w = window.innerWidth, h = window.innerHeight, mobile = w < 760, on = o > 0.6;
    Object.keys(hubEls).forEach(function (k) {
      var x, y;
      if (mobile) { x = k === "stone" ? w * 0.28 : w * 0.72; y = h * 0.58; }
      else { var p = px(HUBPT[k]); x = clamp(p.x, 90, w - 90); y = clamp(p.y, 100, h - 120); }
      hubEls[k].style.setProperty("--hx", x.toFixed(1) + "px"); hubEls[k].style.setProperty("--hy", y.toFixed(1) + "px");
      hubEls[k].classList.toggle("on", on); hubEls[k].tabIndex = on ? 0 : -1;
    });
  }
  Object.keys(hubEls).forEach(function (k) {
    var b = hubEls[k];
    b.addEventListener("mouseenter", function () { if (!jny.active) stage.classList.add("lean-" + k); });
    b.addEventListener("mouseleave", function () { stage.classList.remove("lean-" + k); });
    b.addEventListener("focus", function () { if (!jny.active) stage.classList.add("lean-" + k); });
    b.addEventListener("blur", function () { stage.classList.remove("lean-" + k); });
    b.addEventListener("click", function () { go(b.getAttribute("data-go")); });
  });
  vid.addEventListener("seeked", function () { jny.seeking = false; });
  vid2.addEventListener("seeked", function () { jny.seeking = false; });
  // move a video from one time to another at the fixed speed: forward with native playback, backward by stepping the time
  function playTo(el, from, to, ready, done, rate) {
    rate = rate || JRATE;
    var tok = ++jny.token; jny.busy = true;
    function finish() { if (tok !== jny.token) return; jny.busy = false; done(); }
    function begin() {
      if (tok !== jny.token) return;
      if (ready) ready();
      if (reduce) { el.currentTime = to; setTimeout(finish, 60); return; }
      if (to > from) {
        el.playbackRate = rate;
        var pr = el.play(); if (pr && pr.catch) pr.catch(function () { el.currentTime = to; setTimeout(finish, 60); });
        (function watch() {
          if (tok !== jny.token) return;
          if (el.currentTime >= to - 0.03 || el.ended) { el.pause(); el.currentTime = to; setTimeout(finish, 80); return; }
          requestAnimationFrame(watch);
        })();
      } else {
        el.pause();
        var dur = (from - to) / rate * 1000, t0 = 0;
        (function step(now) {
          if (tok !== jny.token) return;
          if (!t0) t0 = now;
          var p = clamp((now - t0) / dur, 0, 1);
          if (!jny.seeking) { jny.seeking = true; el.currentTime = from - (from - to) * p; }
          if (p < 1) requestAnimationFrame(step); else { el.currentTime = to; setTimeout(finish, 160); }
        })(performance.now());
      }
    }
    el.pause();
    if (Math.abs(el.currentTime - from) > 0.02) {
      var once = function () { el.removeEventListener("seeked", once); begin(); };
      el.addEventListener("seeked", once); el.currentTime = from;
    } else begin();
  }
  function placeSpots() {
    var w = window.innerWidth, h = window.innerHeight, mobile = w < 760;
    Object.keys(SPOTS).forEach(function (k) {
      var p = px(SPOTPT[k]), x = clamp(p.x, mobile ? 76 : 60, w - (mobile ? 76 : 60)), y = clamp(p.y, 90, h - 130);
      var b = SPOTS[k];
      b.style.setProperty("--hx", x.toFixed(1) + "px"); b.style.setProperty("--hy", y.toFixed(1) + "px");
      b.classList.toggle("flip", !mobile && x > w - 280);
    });
  }
  window.addEventListener("resize", placeSpots); placeSpots();
  function setSpots(room) {
    stage.classList.toggle("s-spa", room === "spa"); stage.classList.toggle("s-yoin", room === "yoin");
    Object.keys(SPOTS).forEach(function (k) { var on = (room === "spa" && (k === "plunge" || k === "sauna")) || (room === "yoin" && (k === "yoga" || k === "pilates")); SPOTS[k].tabIndex = on ? 0 : -1; });
  }
  // Photo galleries. Placeholder photos; replace the files in assets/ (and the lists here) with the final ones.
  var GAL = {
    plunge: { cap: "Cold plunge", imgs: ["assets/g-plunge-1.webp", "assets/g-plunge-2.webp", "assets/g-plunge-3.webp", "assets/g-plunge-4.webp"] },
    sauna:  { cap: "Sauna", imgs: ["assets/g-sauna-1.webp", "assets/g-plunge-3.webp"] }
  };
  var gal = document.getElementById("gal"), galImg = document.getElementById("gal-img"), galCap = document.getElementById("gal-cap");
  var galOpen = false, galKey = "", galIdx = 0;
  function showGal(i) {
    var g = GAL[galKey]; galIdx = (i + g.imgs.length) % g.imgs.length;
    galImg.src = g.imgs[galIdx]; galImg.alt = g.cap + ", photo " + (galIdx + 1);
    galCap.textContent = g.cap + (g.imgs.length > 1 ? "  \u00b7  " + (galIdx + 1) + " / " + g.imgs.length : "");
  }
  function openGal(key) {
    galKey = key; galOpen = true; showGal(0);
    gal.classList.toggle("one", GAL[key].imgs.length < 2);
    gal.classList.add("show"); gal.setAttribute("aria-hidden", "false");
    requestAnimationFrame(function () { requestAnimationFrame(function () { gal.classList.add("vis"); }); });
  }
  function closeGal() {
    if (!galOpen) return; galOpen = false; gal.classList.remove("vis"); gal.setAttribute("aria-hidden", "true");
    setTimeout(function () { if (!galOpen) gal.classList.remove("show"); }, 420);
  }
  gal.querySelector(".g-x").addEventListener("click", closeGal);
  gal.querySelector(".g-prev").addEventListener("click", function () { showGal(galIdx - 1); });
  gal.querySelector(".g-next").addEventListener("click", function () { showGal(galIdx + 1); });
  gal.addEventListener("click", function (e) { if (e.target === gal) closeGal(); });
  document.addEventListener("keydown", function (e) {
    if (!galOpen) return;
    if (e.key === "ArrowLeft") showGal(galIdx - 1); else if (e.key === "ArrowRight") showGal(galIdx + 1);
  });
  Object.keys(SPOTS).forEach(function (k) { SPOTS[k].addEventListener("click", function () { go(k); }); });
  function ui(choose, back, label) {
    jnui.classList.toggle("choose", !!choose); jnui.classList.toggle("back", !!back);
    jnui.setAttribute("aria-hidden", back || choose ? "false" : "true");
    if (label) jnBack.textContent = label;
  }
  function text(key) { if (key) { setCopy(key); stage.classList.add("jtext"); } else stage.classList.remove("jtext"); }
  function enter() {
    jny.active = true; stage.classList.add("jny"); stage.classList.remove("lean-stone", "lean-heat", "lean-mem");
    document.documentElement.style.overflow = "hidden";
  }
  function leave() {
    jny.active = false; jny.state = "hub"; jny.busy = false;
    stage.classList.remove("jny", "jtext"); ui(false, false);
    document.documentElement.style.overflow = "";
  }
  function go(where) {
    if (jny.busy || memState !== "idle") return;
    if (where === "heat" && jny.state === "hub") {
      enter(); ui(false, false); vid2.style.opacity = 0;
      playTo(vid, T.desk, T.spa, null, function () { jny.state = "spa"; setSpots("spa"); ui(false, true, "Back to front desk"); }, HEATRATE);
    } else if (where === "stone" && jny.state === "hub") {
      enter(); ui(false, false);
      playTo(vid2, 0, T2.yogaIn, function () { vid2.style.opacity = 1; }, function () { jny.state = "yoin"; setSpots("yoin"); ui(false, true, "Back to front desk"); });
    } else if (where === "plunge" && jny.state === "spa") {
      openGal("plunge");
    } else if (where === "sauna" && jny.state === "spa") {
      openGal("sauna");
    } else if (where === "yoga" && jny.state === "yoin") {
      ui(false, false); setSpots(null);
      playTo(vid2, T2.yogaIn, T2.yoga, null, function () { jny.state = "yoga"; text("yoga"); ui(false, true, "Back"); });
    } else if (where === "pilates" && jny.state === "yoin") {
      ui(false, false); setSpots(null);
      playTo(vid2, T2.pil0, T2.pil1, null, function () { jny.state = "pilates"; text("pilates"); ui(false, true, "Back"); });
    }
  }
  function back() {
    if (!jny.active || jny.busy || galOpen) return;
    var s = jny.state;
    if (s === "spa") { setSpots(null); ui(false, false); playTo(vid, T.spa, T.desk, null, leave, HEATRATE); }
    else if (s === "yoin") { setSpots(null); ui(false, false); playTo(vid2, T2.yogaIn, 0, null, function () { vid2.style.opacity = 0; leave(); }); }
    else if (s === "yoga") { text(null); ui(false, false); playTo(vid2, T2.yoga, T2.yogaIn, null, function () { jny.state = "yoin"; setSpots("yoin"); ui(false, true, "Back to front desk"); }); }
    else if (s === "pilates") { text(null); ui(false, false); playTo(vid2, T2.pil1, T2.pil0, null, function () { vid2.currentTime = T2.yogaIn; jny.state = "yoin"; setSpots("yoin"); ui(false, true, "Back to front desk"); }); }
  }
  jnBack.addEventListener("click", back);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { if (galOpen) closeGal(); else back(); } });

  // Test hook: ?at=<vh>
  var m = /[?&]at=([\d.]+)/.exec(location.search);
  if (m) window.addEventListener("load", function () { setTimeout(function () { window.scrollTo(0, parseFloat(m[1]) / 100 * vh); }, 50); });
})();
</script>
