name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/gracious-noether-b95uuw, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # The artifact is listed a moment after it is uploaded; deploying straight away often fails with
      # "No artifacts named github-pages were found". Give GitHub a few seconds to register it.
      - name: Wait for the artifact to be listed
        run: sleep 25
      - id: deployment
        uses: actions/deploy-pages@v4
