<title>MERI Venue Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Roboto:wght@300;400&display=swap">
<style>
  /* Layout: the floor plan fills the screen; SVG hotspots sit on top of it.
     Single warm look by choice, matching the plan. */
  :root {
    --ink: #2a1a12;
    --cream: #f2e1d3;
    --paper: #fbf1e4;
    --glow: #f0b56b;
    --display: "Playfair Display", Georgia, "Times New Roman", serif;
    --text: "Roboto", "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }
  html, body { margin: 0; height: 100%; }
  body { background: var(--cream); color: var(--ink); font-family: var(--text); overflow: hidden; -webkit-font-smoothing: antialiased; }
  /* soft blurred copy of the plan fills any letterbox space */
  body::before { content: ""; position: fixed; inset: -40px; background: url("assets/plan.jpg") center / cover; filter: blur(34px) saturate(1.05); z-index: -1; }

  #scroller { position: fixed; inset: 0; overflow-x: auto; overflow-y: hidden; display: flex; align-items: center; }
  #mapwrap { position: relative; margin: 0 auto; flex: none; width: max(820px, min(100vw, 177.78vh)); aspect-ratio: 16 / 9; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  svg image { pointer-events: none; }

  #dim { fill: #3b3029; opacity: 0; transition: opacity .25s ease; pointer-events: none; }
  #app.hovering #dim { opacity: .42; }

  .pop { opacity: 0; transition: opacity .2s ease, transform .28s cubic-bezier(.2,.8,.2,1); pointer-events: none;
         filter: drop-shadow(0 16px 20px rgba(30,15,8,.5)); }
  .pop.on { opacity: 1; transform: translateY(-7px) scale(1.045); }

  .rim { fill: none; stroke: #fff; stroke-width: 3; stroke-linejoin: round; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .rim.on { opacity: .9; }
  .hit { fill: rgba(0,0,0,0.001); cursor: pointer; outline: none; }
  .hit.soon { cursor: default; }

  /* label that follows the pointer */
  #tip { position: fixed; z-index: 5; left: 0; top: 0; pointer-events: none; opacity: 0; transform: translate(-50%, -100%); transition: opacity .15s;
         background: rgba(36,22,15,.92); color: var(--paper); border-radius: 14px; padding: 10px 14px 11px; min-width: 150px; max-width: 220px;
         box-shadow: 0 12px 30px rgba(20,10,5,.35); }
  #tip.on { opacity: 1; }
  #tip b { display: block; font-family: var(--display); font-weight: 400; font-size: 19px; line-height: 1.15; }
  #tip span { display: block; margin-top: 4px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--glow); }
  #tip.soon span { color: rgba(251,241,228,.6); }
  #tip img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; margin: 0 0 9px; }
  #tip img[hidden] { display: none; }

  /* hint + sound */
  #hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 4;
          font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink);
          background: rgba(251,241,228,.78); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
          padding: 9px 16px; border-radius: 999px; white-space: nowrap; max-width: calc(100vw - 150px); overflow: hidden; text-overflow: ellipsis; transition: opacity .3s; }
  #snd { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 4;
         font: 400 12px var(--text); letter-spacing: .16em; text-transform: uppercase; color: var(--ink); cursor: pointer;
         background: rgba(251,241,228,.78); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
         border: 1px solid rgba(42,26,18,.28); padding: 9px 14px; border-radius: 999px; }
  #snd:focus-visible, .close:focus-visible, .nav:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  #toast { position: fixed; left: 50%; top: 22px; transform: translate(-50%, -20px); opacity: 0; z-index: 7; pointer-events: none;
           background: rgba(36,22,15,.92); color: var(--paper); font-size: 13px; letter-spacing: .08em; padding: 11px 18px; border-radius: 999px; transition: opacity .25s, transform .25s; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* frame viewer */
  #modal { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 20px max(16px, env(safe-area-inset-left, 0px));
           background: rgba(24,14,9,.72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); opacity: 0; visibility: hidden; transition: opacity .25s, visibility .25s; }
  #modal.on { opacity: 1; visibility: visible; }
  .card { position: relative; width: min(1100px, 100%); transform: translateY(14px) scale(.98); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
  #modal.on .card { transform: none; }
  .card img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 16px; background: #1c130d; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .cap { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-top: 14px; color: var(--paper); }
  .cap h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(24px, 3.4vw, 38px); }
  .cap p { margin: 0; font-size: 14px; letter-spacing: .04em; color: rgba(251,241,228,.78); text-align: right; }
  .close { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer; font-size: 22px; line-height: 1;
           background: rgba(28,19,13,.6); color: var(--paper); backdrop-filter: blur(6px); }
  .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 42px; height: 42px; border-radius: 50%; border: 0; cursor: pointer; font-size: 20px;
         background: rgba(28,19,13,.6); color: var(--paper); backdrop-filter: blur(6px); }
  .nav.prev { left: 12px; } .nav.next { right: 12px; }
  .nav[hidden] { display: none; }
  @media (prefers-reduced-motion: reduce) { .pop, .card, #dim { transition: none; } }
</style>

<div id="app">
  <div id="scroller"><div id="mapwrap"><svg id="svg" viewBox="0 0 1920 1080" role="group" aria-label="Floor plan of the MERI venue"></svg></div></div>
  <div id="tip"><img alt="" hidden><b></b><span></span></div>
  <div id="hint">Hover a room · Click to look inside</div>
  <button id="snd" type="button" aria-pressed="true">Sound on</button>
  <div id="toast" role="status"></div>
  <div id="modal" aria-hidden="true">
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="mt">
      <img id="mimg" alt="">
      <button class="nav prev" type="button" aria-label="Previous frame">&#8249;</button>
      <button class="nav next" type="button" aria-label="Next frame">&#8250;</button>
      <button class="close" type="button" aria-label="Close">&times;</button>
      <div class="cap"><h2 id="mt"></h2><p id="mc"></p></div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var PLAN = "assets/plan.jpg";
  // Frames: key -> file and caption. Rooms with no frame yet stay "coming soon".
  var FRAMES = {
    entrance: { src: "assets/entrance.jpg", cap: "The landing, just inside the door" },
    stairs:   { src: "assets/stairs.jpg",   cap: "The steps down to reception" },
    desk:     { src: "assets/desk.jpg",     cap: "Front desk and lobby" },
    hallway:  { src: "assets/hallway.jpg",  cap: "Lockers and washrooms hallway" },
    spa:      { src: "assets/spa.jpg",      cap: "Cold plunge pools and the sauna beyond" }
  };
  var ROOMS = __ROOMS__;

  var NS = "http://www.w3.org/2000/svg";
  var svg = document.getElementById("svg"), app = document.getElementById("app");
  var tip = document.getElementById("tip"), tipImg = tip.querySelector("img"), tipB = tip.querySelector("b"), tipS = tip.querySelector("span");
  var toast = document.getElementById("toast"), hint = document.getElementById("hint");

  function el(name, attrs, parent) { var e = document.createElementNS(NS, name); for (var k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
  function pts(r) { return r.pts.map(function (p) { return p.join(","); }).join(" "); }
  function centroid(r) { var x = 0, y = 0; r.pts.forEach(function (p) { x += p[0]; y += p[1]; }); return [x / r.pts.length, y / r.pts.length]; }

  // ----- build the map -----
  var defs = el("defs", {}, svg);
  el("image", { href: PLAN, x: 0, y: 0, width: 1920, height: 1080, preserveAspectRatio: "none" }, svg);
  el("rect", { id: "dim", x: 0, y: 0, width: 1920, height: 1080 }, svg);
  var pops = {}, rims = {}, hits = {};
  ROOMS.forEach(function (r) {
    var cp = el("clipPath", { id: "c_" + r.id }, defs); el("polygon", { points: pts(r) }, cp);
    var c = centroid(r);
    var g = el("g", { "class": "pop" }, svg); g.style.transformOrigin = c[0] + "px " + c[1] + "px";
    var inner = el("g", { "clip-path": "url(#c_" + r.id + ")" }, g);
    el("image", { href: PLAN, x: 0, y: 0, width: 1920, height: 1080, preserveAspectRatio: "none" }, inner);
    pops[r.id] = g;
    var rim = el("polygon", { points: pts(r), "class": "rim" }, svg); rim.style.transformOrigin = c[0] + "px " + c[1] + "px"; rims[r.id] = rim;
  });
  ROOMS.forEach(function (r) {
    var h = el("polygon", { points: pts(r), "class": "hit" + (r.imgs.length ? "" : " soon"), tabindex: 0, role: "button",
                            "aria-label": r.name + (r.imgs.length ? "" : " (coming soon)") }, svg);
    hits[r.id] = h;
    h.addEventListener("pointerenter", function (e) { enter(r, e); });
    h.addEventListener("pointermove", function (e) { move(e); });
    h.addEventListener("pointerleave", function () { leave(r); });
    h.addEventListener("focus", function () { var b = h.getBoundingClientRect(); enter(r, { clientX: b.left + b.width / 2, clientY: b.top + b.height / 2 }, true); });
    h.addEventListener("blur", function () { leave(r); });
    h.addEventListener("click", function () { activate(r); });
    h.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); activate(r); } });
  });

  // ----- sound: a soft wooden tick made with the Web Audio API -----
  var ctx = null, noise = null, soundOn = true, lastTick = 0;
  var snd = document.getElementById("snd");
  function audio() {
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      try { ctx = new AC(); } catch (e) { return null; }
      var len = Math.floor(ctx.sampleRate * 0.04), buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
      noise = buf;
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tick(level, pitch) {
    if (!soundOn) return;
    var now = performance.now(); if (now - lastTick < 32) return; lastTick = now;
    var c = audio(); if (!c || c.state !== "running") return;
    var src = c.createBufferSource(); src.buffer = noise; src.playbackRate.value = (pitch || 1) * (0.92 + Math.random() * 0.2);
    var bp = c.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 2300 * (pitch || 1); bp.Q.value = 5;
    var g = c.createGain(); g.gain.value = level;
    src.connect(bp); bp.connect(g); g.connect(c.destination); src.start();
  }
  var touchOnly = !!(window.matchMedia && window.matchMedia("(hover: none)").matches);
  function unlock() { audio(); if (ctx && ctx.state === "running" && !touchOnly) hint.textContent = "Hover a room · Click to look inside · Sound on"; }
  window.addEventListener("pointerdown", unlock, { passive: true });
  window.addEventListener("keydown", unlock);
  snd.addEventListener("click", function () {
    soundOn = !soundOn; snd.textContent = soundOn ? "Sound on" : "Sound off"; snd.setAttribute("aria-pressed", soundOn);
    if (soundOn) { audio(); tick(.5, 1.1); }
  });

  // ----- hover behaviour -----
  var current = null, lastX = 0, lastY = 0, travelled = 0;
  function place(e) {
    var w = tip.offsetWidth, h = tip.offsetHeight, x = e.clientX, y = e.clientY - 18;
    x = Math.min(Math.max(x, w / 2 + 10), window.innerWidth - w / 2 - 10);
    if (y - h < 8) y = e.clientY + h + 26;       // flip below the pointer near the top edge
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }
  function enter(r, e, fromFocus) {
    current = r.id;
    pops[r.id].classList.add("on"); rims[r.id].classList.add("on"); app.classList.add("hovering");
    var f = r.imgs.length ? FRAMES[r.imgs[0]] : null;
    tipB.textContent = r.name; tipS.textContent = f ? "Click to look inside" : "Frame coming soon";
    tip.classList.toggle("soon", !f);
    if (f) { tipImg.src = f.src; tipImg.hidden = false; } else { tipImg.hidden = true; }
    tip.classList.add("on"); place(e);
    lastX = e.clientX; lastY = e.clientY; travelled = 0;
    tick(.55, 1 + (ROOMS.indexOf(r) % 5) * 0.06);
  }
  function move(e) {
    place(e);
    travelled += Math.hypot(e.clientX - lastX, e.clientY - lastY); lastX = e.clientX; lastY = e.clientY;
    if (travelled > 70) { travelled = 0; tick(.16, 0.9); }   // quiet ticks while moving inside a room
  }
  function leave(r) {
    pops[r.id].classList.remove("on"); rims[r.id].classList.remove("on");
    if (current === r.id) { current = null; app.classList.remove("hovering"); tip.classList.remove("on"); }
  }

  // ----- frame viewer -----
  var modal = document.getElementById("modal"), mimg = document.getElementById("mimg"), mt = document.getElementById("mt"), mc = document.getElementById("mc");
  var prev = modal.querySelector(".prev"), next = modal.querySelector(".next"), closeB = modal.querySelector(".close");
  var open = null, idx = 0, opener = null;
  function show() {
    var f = FRAMES[open.imgs[idx]];
    mimg.src = f.src; mimg.alt = open.name + ": " + f.cap; mt.textContent = open.name; mc.textContent = f.cap;
    var multi = open.imgs.length > 1; prev.hidden = !multi; next.hidden = !multi;
  }
  function activate(r) {
    if (!r.imgs.length) { say(r.name + ": frame coming soon"); tick(.2, .7); return; }
    open = r; idx = 0; opener = hits[r.id]; show(); tick(.7, 1.3);
    modal.classList.add("on"); modal.setAttribute("aria-hidden", "false"); closeB.focus();
  }
  function close() { modal.classList.remove("on"); modal.setAttribute("aria-hidden", "true"); if (opener) opener.focus({ preventScroll: true }); open = null; }
  function step(d) { if (!open || open.imgs.length < 2) return; idx = (idx + d + open.imgs.length) % open.imgs.length; show(); tick(.4, 1.2); }
  closeB.addEventListener("click", close);
  modal.addEventListener("click", function (e) { if (e.target === modal) close(); });
  prev.addEventListener("click", function () { step(-1); });
  next.addEventListener("click", function () { step(1); });
  window.addEventListener("keydown", function (e) {
    if (!open) return;
    if (e.key === "Escape") close(); else if (e.key === "ArrowLeft") step(-1); else if (e.key === "ArrowRight") step(1);
  });
  var tt = 0;
  function say(msg) { toast.textContent = msg; toast.classList.add("on"); clearTimeout(tt); tt = setTimeout(function () { toast.classList.remove("on"); }, 1800); }

  // touch devices have no hover, so say what a tap does
  if (touchOnly) hint.textContent = "Tap a room to look inside";
  else hint.textContent = "Hover a room · Click to look inside · Click once to turn on sound";
})();
</script>
